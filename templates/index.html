<!DOCTYPE html>
<html>
<head>
    <title>Clothes Ordering System</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
</head>
<body>
    <h1>Clothes Ordering System</h1>

    <h2>Available Clothes</h2>
    <ul>
        {% for item in clothes %}
        <li>
            {{ item.name }} - ₱{{ item.price }}
            <a href="{{ url_for('order', clothes_id=item.id) }}">Order</a>
        </li>
        {% endfor %}
    </ul>

    <h2>Your Orders</h2>
    <ul>
        {% for order in orders %}
        <li>{{ order.name }} - ₱{{ order.price }}</li>
        {% endfor %}
    </ul>
</body>
</html>
